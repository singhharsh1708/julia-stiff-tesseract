name: "lindauer-julia"
version: "0.1.0"
description: |
  Lindauer et al. 2017 pembrolizumab PK / PD-1 occupancy / tumour growth model (QSPAtlas.jl rebuild),
  solved in Julia with Rodas5P; derivatives by forward-mode AD through the stiff solver.

build_config:
  extra_packages:
    - curl
    - ca-certificates
  package_data:
    - ["julia/Project.toml", "julia/Project.toml"]
    - ["julia/Manifest.toml", "julia/Manifest.toml"]
    - ["julia/src/StiffTesseract.jl", "julia/src/StiffTesseract.jl"]
    - ["julia/src/lindauer_model.jl", "julia/src/lindauer_model.jl"]
  custom_build_steps:
    # Julia 1.10.12 for the image's architecture
    - |
      RUN case "$(uname -m)" in aarch64) d=aarch64; a=aarch64;; x86_64) d=x64; a=x86_64;; esac && \
          curl -fsSL "https://julialang-s3.julialang.org/bin/linux/${d}/1.10/julia-1.10.12-linux-${a}.tar.gz" \
          | tar -xz -C /opt && ln -s /opt/julia-1.10.12/bin/julia /usr/local/bin/julia
    # Install and precompile the Julia environment into a depot the runtime user can read
    - |
      RUN JULIA_DEPOT_PATH=/opt/julia-depot julia --project=/tesseract/julia -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()' && \
          chmod -R a+rX /opt/julia-depot && chmod -R a+rwX /tesseract/julia
    # At run time: a writable depot first, the prebuilt one behind it; juliacall uses this Julia and project, offline
    - |
      ENV JULIA_DEPOT_PATH="/home/tesseract-user/.julia:/opt/julia-depot:" \
          PYTHON_JULIAPKG_EXE=/usr/local/bin/julia \
          PYTHON_JULIAPKG_PROJECT=/tesseract/julia \
          PYTHON_JULIAPKG_OFFLINE=yes
